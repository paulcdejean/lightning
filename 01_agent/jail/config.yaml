# Hermes Agent configuration for the lightning jail.
#
# LLM traffic goes to OpenRouter (OpenAI-compatible router) via a `custom`
# provider authenticated with a static API key — no OAuth, so it works in a
# headless container.
#
# Web search and other server-side tools are provided by OpenRouter's server
# tools feature. A small Hermes plugin (plugins/openrouter-web-search)
# injects {type: "openrouter:web_search"} etc. into the API request's tools
# array via LLM request middleware. OpenRouter intercepts and executes these
# tools server-side — the model sees search results inline. The plugin also
# registers no-op handlers in the Hermes tool registry as a safety net.
#
# OPENROUTER_API_KEY is injected into the container env from .env (which 01_agent
# templates from the AWS Secrets Manager secret agent/openrouter_api_key).
# ${VAR} placeholders are interpolated from the environment at config load.

model:
  default: "openrouter/owl-alpha:online"
  provider: custom
  base_url: "https://openrouter.ai/api/v1"
  api_key: ${OPENROUTER_API_KEY}

# Enable the openrouter-web-search plugin (copied into ~/.hermes/plugins/
# by the containerfile), which injects OpenRouter server tools into the
# API request. Configure the desired server tools below.
plugins:
  enabled:
    - openrouter-web-search
  entries:
    openrouter-web-search:
      server_tools:
        - type: openrouter:web_search
          parameters:
            engine: exa
            max_results: 5
        - type: openrouter:web_fetch
        - type: openrouter:datetime

# Show the model's reasoning/thinking tokens by default (was the default in pi).
display:
  show_reasoning: true

# This Hermes instance runs inside a disposable Fedora container jail, so the
# approval prompt before destructive CLI commands (rm -rf, git reset --hard,
# etc.) is unnecessary friction. `off` is equivalent to running with --yolo.
approvals:
  mode: off

# Tirith security scanning (default on) is a SEPARATE guard from approvals:
# it pattern-matches shell commands (e.g. "mass file deletion in a short
# window") and prompts for approval independently of approvals.mode. In this
# disposable jail where approvals.mode is already off, the Tirith prompt is
# the same friction for no benefit, so disable it too.
security:
  tirith_enabled: false

# Disable the hardcoded "coding agent" system-prompt block (the
# CODING_AGENT_GUIDANCE constant in agent/coding_context.py). It injects a
# "you are a senior engineer" persona and a "don't commit unless asked" rule
# that we don't want — commit policy belongs in AGENTS.md, not a baked-in
# prompt block. agent.coding_context: off removes the entire block.
agent:
  coding_context: off

# Cloud browser automation is disabled. The only no-extra-credential option was
# the Nous Tool Gateway's Browser Use backend, but that authenticates via Nous
# Portal OAuth (a Portal login stored in auth.json), which can't be completed in
# a headless, disposable jail. Rather than add a separate Browser Use /
# Browserbase API key, we leave cloud browsing off. To re-enable later, set:
#   browser:
#     cloud_provider: browser-use
#     use_gateway: false   # then supply a direct BROWSER_USE_API_KEY in .env

# Read-only documentation MCP servers used during the terraform `tofu plan`
# chores: provider/resource lookups (OpenTofu registry) and Cloudflare docs.
mcp_servers:
  opentofu:
    url: "https://mcp.opentofu.org/mcp"
  cloudflare-docs:
    url: "https://docs.mcp.cloudflare.com/mcp"
